<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iiSU Slideshow Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pure, full-bleed slideshow container -->
  <div class="slideshow-widget">
    <!-- Updated with your 8 precise file extensions (.png vs .jpg) -->
    <div class="slide active" style="background-image: url('Crash 1.png');"></div>
    <div class="slide" style="background-image: url('Dissidia.png');"></div>
    <div class="slide" style="background-image: url('FFX.png');"></div>
    <div class="slide" style="background-image: url('Gravity Rush.png');"></div>
    <div class="slide" style="background-image: url('Jak.png');"></div>
    <div class="slide" style="background-image: url('KH1.png');"></div>
    <div class="slide" style="background-image: url('MK8.jpg');"></div>
    <div class="slide" style="background-image: url('SMG.jpg');"></div>
  </div>

  <!-- JavaScript handles only the image loops now -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const slides = document.querySelectorAll('.slide');
      let currentIndex = 0;

      setInterval(() => {
        slides[currentIndex].classList.remove('active');
        
        setTimeout((idx) => {
          slides[idx].style.transform = "scale(1.05)";
        }, 1500, currentIndex);

        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
      }, 4000); // 4000 milliseconds = 4 seconds per slide instead of 7
    });
  </script>
</body>
</html>
